<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rahul Labade | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            width: 500px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,.25);
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: normal;
            color: #dbeafe;
            margin-bottom: 20px;
        }

        p {
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background: white;
            color: #2563eb;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: bold;
            transition: .3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background: #f3f4f6;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #e5e7eb;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>👋 Hello!</h1>

    <h2>I'm Rahul Labade</h2>

    <p>
        Technical Lead Engineer with 12+ years of experience building scalable
        SaaS platforms, AI applications, and cloud solutions.
    </p>

    <p>
        🚀 Python • FastAPI • Azure • Kubernetes • AI Agents • LLMs
    </p>

    <a class="btn" href="https://github.com/ff-bapul" target="_blank">
        View GitHub
    </a>

    <footer>
        © 2026 Rahul Labade
    </footer>
</div>

</body>
</html>
